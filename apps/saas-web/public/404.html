<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Liveness Cloud Console</title>
    <script type="text/javascript">
      // GitHub Pages redirect for HashRouter
      // If hosted on GitHub Pages (*.github.io/repo-name/), keep 1 segment.
      // If hosted on a custom root domain, keep 0 segments.
      var isGitHubPages = window.location.hostname.endsWith("github.io");
      var pathSegmentsToKeep = isGitHubPages ? 1 : 0;

      var l = window.location;
      var basePath = l.pathname
        .split("/")
        .slice(0, 1 + pathSegmentsToKeep)
        .join("/");
      var subPath = l.pathname
        .slice(1)
        .split("/")
        .slice(pathSegmentsToKeep)
        .join("/");

      var target =
        l.protocol +
        "//" +
        l.hostname +
        (l.port ? ":" + l.port : "") +
        basePath +
        "/#/" +
        subPath +
        (l.search ? l.search : "") +
        l.hash;

      l.replace(target);
    </script>
  </head>
  <body></body>
</html>
